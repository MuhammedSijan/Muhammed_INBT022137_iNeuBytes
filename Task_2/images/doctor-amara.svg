<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-amara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="skin-amara" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bg-amara)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#4f46e5" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Hair (Braids/Updo) -->
  <ellipse cx="100" cy="65" rx="36" ry="28" fill="#18181b"/>
  
  <!-- Body / Coat -->
  <path d="M45,200 C45,150 70,135 100,135 C130,135 155,150 155,200 Z" fill="#312e81"/>
  <!-- Indigo Scrub -->
  <path d="M85,140 L100,165 L115,140 Z" fill="#4338ca"/>
  <!-- White Lab Coat -->
  <path d="M45,200 C45,155 65,140 85,140 L96,192 L75,200 Z" fill="#ffffff"/>
  <path d="M155,200 C155,155 135,140 115,140 L104,192 L125,200 Z" fill="#ffffff"/>
  
  <!-- Stethoscope -->
  <path d="M78,145 C78,175 92,185 100,185 C108,185 122,175 122,145" fill="none" stroke="#4338ca" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="100" cy="188" r="6" fill="#818cf8" stroke="#312e81" stroke-width="2"/>
  
  <!-- Neck -->
  <rect x="90" y="115" width="20" height="25" rx="4" fill="url(#skin-amara)"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="88" rx="26" ry="30" fill="url(#skin-amara)"/>
  
  <!-- Hair Front -->
  <path d="M72,78 C72,55 128,55 128,78 C122,62 112,54 100,54 C88,54 78,62 72,78 Z" fill="#18181b"/>
  
  <!-- Small Pearl Earrings -->
  <circle cx="73" cy="94" r="2.5" fill="#f8fafc"/>
  <circle cx="127" cy="94" r="2.5" fill="#f8fafc"/>
  
  <!-- Eyes -->
  <ellipse cx="88" cy="88" rx="3" ry="3.5" fill="#18181b"/>
  <ellipse cx="112" cy="88" rx="3" ry="3.5" fill="#18181b"/>
  <circle cx="89" cy="86.5" r="1" fill="#ffffff"/>
  <circle cx="113" cy="86.5" r="1" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M82,81 C85,78 93,79 94,82" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M106,82 C107,79 115,78 118,81" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M100,88 L98,96 L102,96" fill="none" stroke="#451a03" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Elegant Smile -->
  <path d="M92,104 C96,109 104,109 108,104" fill="none" stroke="#831843" stroke-width="2.2" stroke-linecap="round"/>
</svg>
