      <stop offset="0%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>
    <linearGradient id="skin-elena" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bg-elena)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#c026d3" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Hair Back / Bun -->
  <circle cx="100" cy="50" r="22" fill="#18181b"/>
  
  <!-- Body / Coat -->
  <path d="M45,200 C45,150 70,135 100,135 C130,135 155,150 155,200 Z" fill="#4a044e"/>
  <!-- Inner shirt -->
  <path d="M85,140 L100,168 L115,140 Z" fill="#701a75"/>
  <!-- White Lab Coat -->
  <path d="M45,200 C45,155 65,140 85,140 L96,192 L75,200 Z" fill="#ffffff"/>
  <path d="M155,200 C155,155 135,140 115,140 L104,192 L125,200 Z" fill="#ffffff"/>
  
  <!-- Neck -->
  <rect x="90" y="115" width="20" height="25" rx="4" fill="#fde68a"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="88" rx="26" ry="30" fill="#fde68a"/>
  
  <!-- Sleek Dark Hair -->
  <path d="M72,82 C72,55 128,55 128,82 C125,60 115,52 100,52 C85,52 75,60 72,82 Z" fill="#18181b"/>
  
  <!-- Eyes -->
