  <ellipse cx="112" cy="87" rx="3" ry="3.5" fill="#18181b"/>
  <circle cx="89" cy="85.5" r="1" fill="#ffffff"/>
  <circle cx="113" cy="85.5" r="1" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M83,81 C86,78 93,79 94,82" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M106,82 C107,79 114,78 117,81" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M100,87 L98,95 L102,95" fill="none" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
