  <!-- Medical ID Badge -->
  <rect x="65" y="160" width="16" height="22" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="68" y="163" width="10" height="7" fill="#c026d3"/>
  <line x1="68" y1="174" x2="78" y2="174" stroke="#94a3b8" stroke-width="1.5"/>
