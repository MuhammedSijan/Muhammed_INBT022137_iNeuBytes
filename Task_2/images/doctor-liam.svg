<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-liam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="skin-liam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bg-liam)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#16a34a" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Body / Coat -->
  <path d="M45,200 C45,150 70,135 100,135 C130,135 155,150 155,200 Z" fill="#14532d"/>
  <!-- Light Green Scrub -->
  <path d="M85,140 L100,165 L115,140 Z" fill="#22c55e"/>
  <!-- White Lab Coat -->
  <path d="M45,200 C45,155 65,140 85,140 L96,192 L75,200 Z" fill="#ffffff"/>
  <path d="M155,200 C155,155 135,140 115,140 L104,192 L125,200 Z" fill="#ffffff"/>
  
  <!-- Neck -->
  <rect x="90" y="115" width="20" height="25" rx="4" fill="url(#skin-liam)"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="88" rx="27" ry="30" fill="url(#skin-liam)"/>
  
  <!-- Light Brown / Auburn Wavy Hair -->
  <path d="M72,78 C72,48 128,48 128,78 C128,62 118,50 100,50 C82,50 72,62 72,78 Z" fill="#b45309"/>
  <path d="M70,72 C73,62 80,55 92,52 C104,50 118,52 128,62 C125,58 116,55 102,55 C88,55 76,62 70,72 Z" fill="#92400e"/>
  
  <!-- Eyes -->
  <circle cx="87" cy="88" r="3" fill="#1e293b"/>
  <circle cx="113" cy="88" r="3" fill="#1e293b"/>
  <circle cx="88.5" cy="86.5" r="1" fill="#ffffff"/>
  <circle cx="114.5" cy="86.5" r="1" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M81,81 C84,79 92,79 94,82" fill="none" stroke="#92400e" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M106,82 C108,79 116,79 119,81" fill="none" stroke="#92400e" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M100,88 L98,96 L102,96" fill="none" stroke="#ea580c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Cheerful Smile -->
  <path d="M92,104 C96,108 104,108 108,104" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>
</svg>
