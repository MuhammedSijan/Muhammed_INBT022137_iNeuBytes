  <path d="M80,78 C83,76 92,76 94,79" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M106,79 C108,76 117,76 120,78" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  
