  <path d="M155,200 C155,155 132,140 115,140 L106,195 L125,200 Z" fill="#ffffff"/>
  
  <!-- Neck -->
  <rect x="90" y="115" width="20" height="25" rx="4" fill="#fed7aa"/>
  
  <!-- Head -->
