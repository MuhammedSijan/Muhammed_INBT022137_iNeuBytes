  <path d="M92,105 C96,109 104,109 108,105" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>
  <path d="M88,110 C94,115 106,115 112,110" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="1 2" stroke-linecap="round" opacity="0.5"/>
