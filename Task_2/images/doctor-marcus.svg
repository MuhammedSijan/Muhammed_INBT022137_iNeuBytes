  <rect x="105" y="82" width="16" height="12" rx="3" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="95" y1="88" x2="105" y2="88" stroke="#0f172a" stroke-width="2"/>
  <line x1="74" y1="85" x2="79" y2="87" stroke="#0f172a" stroke-width="2"/>
  <line x1="121" y1="87" x2="126" y2="85" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="87" cy="88" r="2.5" fill="#0f172a"/>
  <circle cx="113" cy="88" r="2.5" fill="#0f172a"/>
  
