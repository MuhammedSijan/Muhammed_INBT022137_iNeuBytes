<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-olivia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="skin-olivia" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bg-olivia)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#ea580c" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Hair Back / Ponytail -->
  <path d="M125,70 C140,85 145,115 138,135 C132,135 130,120 125,100 Z" fill="#451a03"/>
  
  <!-- Body / Coat -->
  <path d="M45,200 C45,150 70,135 100,135 C130,135 155,150 155,200 Z" fill="#1e293b"/>
  <!-- Dark teal scrub -->
  <path d="M85,140 L100,165 L115,140 Z" fill="#0f766e"/>
  <!-- White Lab Coat -->
  <path d="M45,200 C45,155 65,140 85,140 L96,192 L75,200 Z" fill="#ffffff"/>
  <path d="M155,200 C155,155 135,140 115,140 L104,192 L125,200 Z" fill="#ffffff"/>
  
  <!-- Neck -->
  <rect x="90" y="115" width="20" height="25" rx="4" fill="url(#skin-olivia)"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="88" rx="26" ry="30" fill="url(#skin-olivia)"/>
  
  <!-- Dark Brunette Hair -->
  <path d="M72,80 C74,54 126,54 128,80 C125,60 115,52 100,52 C85,52 75,60 72,80 Z" fill="#451a03"/>
  <path d="M72,78 C72,65 82,56 100,56 C118,56 128,65 128,78 C124,70 115,64 100,64 C85,64 76,70 72,78 Z" fill="#291202"/>
  
  <!-- Eyes -->
  <ellipse cx="88" cy="88" rx="3" ry="3.5" fill="#1e293b"/>
  <ellipse cx="112" cy="88" rx="3" ry="3.5" fill="#1e293b"/>
  <circle cx="89" cy="86.5" r="1" fill="#ffffff"/>
  <circle cx="113" cy="86.5" r="1" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M82,81 C85,78 93,79 94,82" fill="none" stroke="#291202" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M106,82 C107,79 115,78 118,81" fill="none" stroke="#291202" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M100,88 L98,96 L102,96" fill="none" stroke="#ea580c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Confident Smile -->
  <path d="M92,103 C96,108 104,108 108,103" fill="none" stroke="#991b1b" stroke-width="2" stroke-linecap="round"/>
</svg>
