<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments Management – MediLink</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-layout">
    <!-- Fixed Left Sidebar -->
    <aside class="app-sidebar" id="appSidebar"></aside>

    <!-- Main Content Area -->
    <div class="app-main">
      <!-- Global Topbar -->
      <header class="app-topbar" id="appTopbar"></header>

      <!-- Page Content -->
      <main class="app-content">
        <!-- Page Header -->
        <div class="dashboard-header">
          <div class="dashboard-greeting">
            <h1 class="dashboard-title">Appointment Management</h1>
            <p class="dashboard-subtitle">Browse, filter, schedule, and track medical appointments.</p>
          </div>
          <div class="dashboard-actions">
            <button class="btn btn-primary" onclick="openBookingModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Book New Appointment
            </button>
          </div>
        </div>

        <!-- Filter Controls Bar -->
        <div class="filter-bar">
          <div class="filter-group">
            <label class="form-label" style="margin:0;">Status:</label>
            <select id="appointmentStatusFilter" class="filter-select" onchange="filterAppointmentsTable()">
              <option value="all">All Statuses</option>
              <option value="Pending">Pending</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>

            <label class="form-label" style="margin:0; margin-left:0.5rem;">Date:</label>
            <input type="date" id="appointmentDateFilter" class="form-control" style="width: auto; padding: 0.45rem 0.75rem;" onchange="filterAppointmentsTable()">
          </div>

          <div class="filter-group">
            <input type="text" id="appointmentSearchInput" class="form-control" placeholder="Search doctor, patient, reason..." style="width:240px; padding:0.45rem 0.75rem;" oninput="filterAppointmentsTable()">
            <button class="btn btn-sm btn-secondary" onclick="resetAppointmentFilters()">Reset</button>
          </div>
        </div>

        <!-- Appointments Master Table Card -->
        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Ref ID</th>
                  <th>Patient</th>
                  <th>Doctor & Specialty</th>
                  <th>Department</th>
                  <th>Schedule</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="masterAppointmentsTableBody">
                <tr><td colspan="7" style="text-align:center; padding:2rem; color:#94A3B8;">Loading appointments...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/patient.js"></script>
  <script src="js/doctor.js"></script>
  <script>
    let cachedAppointments = [];

    async function loadAppointmentsPage() {
      const user = api.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      try {
        const res = await api.get('/appointments');
        cachedAppointments = res.data || [];
        renderAppointmentsTable(cachedAppointments);
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    function renderAppointmentsTable(appointments) {
      const tbody = document.getElementById('masterAppointmentsTableBody');
      if (!tbody) return;

      if (appointments.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:3rem; color:#94A3B8;">No appointments match the selected criteria.</td></tr>`;
        return;
      }

      const user = api.getUser();

      tbody.innerHTML = appointments.map(app => `
        <tr>
          <td><strong>#${app.id}</strong></td>
          <td>
            <div style="font-weight:600;">${app.patient_name}</div>
            <div style="font-size:0.78rem; color:#64748B;">${app.patient_phone || app.patient_email}</div>
          </td>
          <td>
            <div style="font-weight:600;">${app.doctor_name}</div>
            <div style="font-size:0.78rem; color:#7667E8;">${app.doctor_specialization}</div>
          </td>
          <td>${app.department_name}</td>
          <td>
            <div>${app.appointment_date}</div>
            <div style="font-size:0.78rem; color:#64748B;">${formatTime(app.appointment_time)}</div>
          </td>
          <td><span class="badge badge-${app.status.toLowerCase()}">${app.status}</span></td>
          <td>
            <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
              ${user.role === 'doctor' || user.role === 'admin' ? `
                <button class="btn btn-sm btn-primary" onclick="openConsultationModal(${app.id}, '${encodeURIComponent(app.patient_name)}', '${app.status}', '${encodeURIComponent(app.consultation_notes || '')}', '${encodeURIComponent(app.prescription || '')}')">
                  Update
                </button>
              ` : ''}

              ${app.status === 'Completed' && app.consultation_notes ? `
                <button class="btn btn-sm btn-secondary" onclick="viewNotesModal('${encodeURIComponent(app.doctor_name)}', '${encodeURIComponent(app.consultation_notes)}', '${encodeURIComponent(app.prescription || 'None')}')">Notes</button>
              ` : ''}

              ${app.status !== 'Cancelled' && app.status !== 'Completed' ? `
                <button class="btn btn-sm btn-secondary" style="color:#EF5350;" onclick="openCancelModal(${app.id})">Cancel</button>
              ` : ''}
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterAppointmentsTable() {
      const status = document.getElementById('appointmentStatusFilter').value;
      const date = document.getElementById('appointmentDateFilter').value;
      const search = (document.getElementById('appointmentSearchInput').value || '').toLowerCase().trim();

      let filtered = cachedAppointments;

      if (status && status !== 'all') {
        filtered = filtered.filter(a => a.status === status);
      }

      if (date) {
        filtered = filtered.filter(a => a.appointment_date === date);
      }

      if (search) {
        filtered = filtered.filter(a => 
          (a.patient_name && a.patient_name.toLowerCase().includes(search)) ||
          (a.doctor_name && a.doctor_name.toLowerCase().includes(search)) ||
          (a.department_name && a.department_name.toLowerCase().includes(search)) ||
          (a.reason && a.reason.toLowerCase().includes(search))
        );
      }

      renderAppointmentsTable(filtered);
    }

    function resetAppointmentFilters() {
      document.getElementById('appointmentStatusFilter').value = 'all';
      document.getElementById('appointmentDateFilter').value = '';
      document.getElementById('appointmentSearchInput').value = '';
      renderAppointmentsTable(cachedAppointments);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadAppointmentsPage();
    });
  </script>
</body>
</html>
