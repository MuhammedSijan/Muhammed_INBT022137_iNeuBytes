<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Patient Account – MediLink</title>
  <meta name="description" content="Register a new patient account on MediLink Healthcare Platform.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-page-wrapper">
    <div class="auth-card auth-card-wide">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="brand-icon">M</div>
          <span class="brand-title" style="color: var(--text-primary); font-size: 1.4rem;">MediLink</span>
        </a>
        <h1 class="auth-title">Create Patient Account</h1>
        <p class="auth-subtitle">Register to book doctor appointments and manage your health records</p>
      </div>

      <form id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="full_name">Full Name *</label>
            <input type="text" id="full_name" class="form-control" placeholder="e.g. John Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number *</label>
            <input type="tel" id="phone" class="form-control" placeholder="+1 (555) 012-3456" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="date_of_birth">Date of Birth</label>
            <input type="date" id="date_of_birth" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="gender">Gender</label>
            <select id="gender" class="form-control">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="blood_group">Blood Group</label>
            <select id="blood_group" class="form-control">
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="address">Residential Address</label>
          <input type="text" id="address" class="form-control" placeholder="123 Health Ave, Springfield">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password *</label>
            <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password *</label>
            <input type="password" id="confirm_password" class="form-control" placeholder="Repeat password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html" style="font-weight: 600;">Sign In here</a></p>
        <div style="margin-top: 1rem;">
          <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);">&larr; Return to Home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
