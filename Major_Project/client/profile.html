<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile & Settings – MediLink</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-layout">
    <!-- Fixed Left Sidebar -->
    <aside class="app-sidebar" id="appSidebar"></aside>

    <!-- Main Content Area -->
    <div class="app-main">
      <!-- Global Topbar -->
      <header class="app-topbar" id="appTopbar"></header>

      <!-- Page Content -->
      <main class="app-content">
        <div class="dashboard-header">
          <div class="dashboard-greeting">
            <h1 class="dashboard-title">Account Profile & Settings</h1>
            <p class="dashboard-subtitle">Manage personal contact details, medical background, and security preferences.</p>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
          <!-- Left Column: Personal Information Form -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Personal Profile Information</h3>
            </div>

            <form id="profileForm" onsubmit="handleProfileUpdate(event)">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="profileName">Full Name *</label>
                  <input type="text" id="profileName" class="form-control" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="profileEmail">Email Address (Read-only)</label>
                  <input type="email" id="profileEmail" class="form-control" disabled style="background:#F1F5F9; cursor:not-allowed;">
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="profilePhone">Phone Number *</label>
                  <input type="tel" id="profilePhone" class="form-control" required>
                </div>
                <div class="form-group" id="dobGroup">
                  <label class="form-label" for="profileDob">Date of Birth</label>
                  <input type="date" id="profileDob" class="form-control">
                </div>
              </div>

              <!-- Patient-Specific Fields -->
              <div id="patientExtraFields">
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label" for="profileGender">Gender</label>
                    <select id="profileGender" class="form-control">
                      <option value="Male">Male</option>
                      <option value="Female">Female</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="profileBloodGroup">Blood Group</label>
                    <select id="profileBloodGroup" class="form-control">
                      <option value="O+">O+</option>
                      <option value="O-">O-</option>
                      <option value="A+">A+</option>
                      <option value="A-">A-</option>
                      <option value="B+">B+</option>
                      <option value="B-">B-</option>
                      <option value="AB+">AB+</option>
                      <option value="AB-">AB-</option>
                    </select>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label" for="profileAddress">Address</label>
                  <input type="text" id="profileAddress" class="form-control">
                </div>

                <div class="form-group">
                  <label class="form-label" for="profileEmergency">Emergency Contact</label>
                  <input type="text" id="profileEmergency" class="form-control" placeholder="Contact name and phone number">
                </div>

                <div class="form-group">
                  <label class="form-label" for="profileMedicalHistory">Medical History & Allergies</label>
                  <textarea id="profileMedicalHistory" class="form-control" rows="3"></textarea>
                </div>
              </div>

              <!-- Doctor-Specific Fields -->
              <div id="doctorExtraFields" style="display:none;">
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label" for="profileSpecialization">Specialization</label>
                    <input type="text" id="profileSpecialization" class="form-control">
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="profileRoom">Room / Consultation Wing</label>
                    <input type="text" id="profileRoom" class="form-control">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="profileBio">Physician Bio</label>
                  <textarea id="profileBio" class="form-control" rows="3"></textarea>
                </div>
              </div>

              <button type="submit" id="saveProfileBtn" class="btn btn-primary" style="margin-top: 1rem;">
                Save Profile Changes
              </button>
            </form>
          </div>

          <!-- Right Column: Security & Password -->
          <div>
            <div class="card" style="margin-bottom: 1.5rem;">
              <div class="card-header">
                <h3 class="card-title">Security & Password</h3>
              </div>

              <form id="passwordForm" onsubmit="handlePasswordUpdate(event)">
                <div class="form-group">
                  <label class="form-label" for="currentPassword">Current Password</label>
                  <input type="password" id="currentPassword" class="form-control" required placeholder="••••••••">
                </div>

                <div class="form-group">
                  <label class="form-label" for="newPassword">New Password</label>
                  <input type="password" id="newPassword" class="form-control" required placeholder="Minimum 6 characters">
                </div>

                <div class="form-group">
                  <label class="form-label" for="confirmPassword">Confirm New Password</label>
                  <input type="password" id="confirmPassword" class="form-control" required placeholder="Repeat new password">
                </div>

                <button type="submit" id="savePasswordBtn" class="btn btn-secondary" style="width: 100%;">
                  Update Password
                </button>
              </form>
            </div>

            <!-- Account Summary Card -->
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Account Session</h3>
              </div>
              <p style="font-size: 0.88rem; color: #64748B; margin-bottom: 1rem;">Authenticated via secure JSON Web Token with role-based clinical authorization.</p>
              <button class="btn btn-danger" style="width: 100%;" onclick="logoutUser()">
                Log Out
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function loadUserProfile() {
      const user = api.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      try {
        const res = await api.get('/auth/me');
        const data = res.user;

        document.getElementById('profileName').value = data.full_name || '';
        document.getElementById('profileEmail').value = data.email || '';
        document.getElementById('profilePhone').value = data.phone || '';

        const profile = data.profile || {};

        if (data.role === 'patient') {
          document.getElementById('patientExtraFields').style.display = 'block';
          document.getElementById('doctorExtraFields').style.display = 'none';

          if (profile.date_of_birth) {
            document.getElementById('profileDob').value = profile.date_of_birth.substring(0, 10);
          }
          if (profile.gender) document.getElementById('profileGender').value = profile.gender;
          if (profile.blood_group) document.getElementById('profileBloodGroup').value = profile.blood_group;
          document.getElementById('profileAddress').value = profile.address || '';
          document.getElementById('profileEmergency').value = profile.emergency_contact || '';
          document.getElementById('profileMedicalHistory').value = profile.medical_history || '';
        } else if (data.role === 'doctor') {
          document.getElementById('patientExtraFields').style.display = 'none';
          document.getElementById('doctorExtraFields').style.display = 'block';
          document.getElementById('dobGroup').style.display = 'none';

          document.getElementById('profileSpecialization').value = profile.specialization || '';
          document.getElementById('profileRoom').value = profile.room_number || '';
          document.getElementById('profileBio').value = profile.bio || '';
        } else {
          document.getElementById('patientExtraFields').style.display = 'none';
          document.getElementById('doctorExtraFields').style.display = 'none';
          document.getElementById('dobGroup').style.display = 'none';
        }

      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function handleProfileUpdate(e) {
      e.preventDefault();
      const full_name = document.getElementById('profileName').value.trim();
      const phone = document.getElementById('profilePhone').value.trim();
      const date_of_birth = document.getElementById('profileDob')?.value;
      const gender = document.getElementById('profileGender')?.value;
      const blood_group = document.getElementById('profileBloodGroup')?.value;
      const address = document.getElementById('profileAddress')?.value;
      const emergency_contact = document.getElementById('profileEmergency')?.value;
      const medical_history = document.getElementById('profileMedicalHistory')?.value;
      const specialization = document.getElementById('profileSpecialization')?.value;
      const room_number = document.getElementById('profileRoom')?.value;
      const bio = document.getElementById('profileBio')?.value;

      const btn = document.getElementById('saveProfileBtn');

      try {
        btn.disabled = true;
        btn.textContent = 'Saving...';

        const res = await api.put('/auth/profile', {
          full_name,
          phone,
          date_of_birth,
          gender,
          blood_group,
          address,
          emergency_contact,
          medical_history,
          specialization,
          room_number,
          bio
        });

        showToast(res.message || 'Profile updated successfully!', 'success');
        
        // Update stored user
        const currentUser = api.getUser();
        if (currentUser) {
          currentUser.full_name = full_name;
          currentUser.phone = phone;
          api.setUser(currentUser);
          renderSidebar();
          renderTopbar();
        }
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Profile Changes';
      }
    }

    async function handlePasswordUpdate(e) {
      e.preventDefault();
      const current_password = document.getElementById('currentPassword').value;
      const new_password = document.getElementById('newPassword').value;
      const confirm_password = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('savePasswordBtn');

      if (new_password !== confirm_password) {
        showToast('New passwords do not match.', 'warning');
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = 'Updating...';

        const res = await api.put('/auth/password', {
          current_password,
          new_password,
          confirm_password
        });

        showToast(res.message || 'Password changed successfully!', 'success');
        document.getElementById('passwordForm').reset();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadUserProfile();
    });
  </script>
</body>
</html>
