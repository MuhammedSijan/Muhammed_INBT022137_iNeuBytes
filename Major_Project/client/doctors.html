<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Doctors – MediLink Healthcare System</title>
  <meta name="description" content="Search and browse verified clinical doctors, specialists, and physicians across departments.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-layout">
    <!-- Fixed Left Sidebar -->
    <aside class="app-sidebar" id="appSidebar"></aside>

    <!-- Main Content Area -->
    <div class="app-main">
      <!-- Global Topbar -->
      <header class="app-topbar" id="appTopbar"></header>

      <!-- Page Content -->
      <main class="app-content">
        <!-- Page Header -->
        <div class="dashboard-header">
          <div class="dashboard-greeting">
            <h1 class="dashboard-title">Medical Specialists & Physicians</h1>
            <p class="dashboard-subtitle">Browse board-certified doctors, check clinical availability, and book direct consultations.</p>
          </div>
          <div class="dashboard-actions" id="adminDoctorControls" style="display:none;">
            <button class="btn btn-primary" onclick="openCreateDoctorModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Add New Doctor (Admin)
            </button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="filter-group">
            <label class="form-label" style="margin:0;">Filter by Department:</label>
            <select id="doctorDeptFilter" class="filter-select" onchange="filterDoctors()">
              <option value="">All Departments</option>
            </select>
          </div>

          <div class="filter-group">
            <input type="text" id="doctorSearchInput" class="form-control" placeholder="Search doctor by name or specialty..." style="width: 280px;" oninput="filterDoctors()">
          </div>
        </div>

        <!-- Doctors Grid Container -->
        <div class="doctors-grid" id="doctorsGridContainer">
          <div style="grid-column: 1/-1; text-align:center; padding:3rem; color:#94A3B8;">Loading specialists directory...</div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/doctors.js"></script>
  <script src="js/patient.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadDoctorsPage();

      // Check URL search params (e.g. ?dept=1)
      const urlParams = new URLSearchParams(window.location.search);
      const deptParam = urlParams.get('dept');
      if (deptParam) {
        setTimeout(() => {
          const filter = document.getElementById('doctorDeptFilter');
          if (filter) {
            filter.value = deptParam;
            filterDoctors();
          }
        }, 300);
      }
    });
  </script>
</body>
</html>
